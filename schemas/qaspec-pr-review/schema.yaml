name: qaspec-pr-review
version: 1
description: QASpec QA workflow — analysis → test cases + specs → Qase publish
artifacts:
  - id: analyze
    generates: analysis.md
    description: PR/requirements analysis, risks, and regression signals
    template: analysis.md
    instruction: |
      Create `analysis.md` as the testable-change analysis artifact, co-produced with change delta specs.

      **Language:** Write all artifact body text and halt messages in the project language from
      `qaspec/config.yaml` `context` and `rules.analyze` (see docs/multi-language.md).

      **Config:** Apply global `context` (QA role, stack, domain) and `rules.analyze` from config — do not copy them into the file.

      Before writing:
      - Run `/qsx:analyze` skill steps: `qaspec instructions analyze --json` for template and resolvedOutputPath.
      - Read `qaspec/references/historical_bugs.md` from the project root (mandatory; re-read every pass).
      - Gather the change set via `gh pr diff` / `gh pr view` when reviewing a GitHub PR, or `git diff` / user-supplied patch otherwise.
      - For each affected capability, read `qaspec/specs/<capability>/spec.md` when that file exists (previously agreed behavior; baseline for MODIFIED deltas).
      - Honor `workflow.multipleSubagents.review` from `qaspec/config.yaml` (default false): when true, use dual blind analyst Task delegations in parallel (each analyst fetches the diff) and synthesize Agreed / Single-analyst / Contradiction in **Synthesis notes**; when false, orchestrator fetches the diff and writes `analysis.md` with no Task subagents.

      Fill every section in the template, using N/A when not applicable:
      - Summary, **Affected capabilities** (kebab-case)
      - Functional intent vs implementation, **Validated clarifications** (N/A until user responds to halt)
      - **Unvalidated assumptions** (risk-ordered, confidence-marked; empty when none)
      - Functional impact, framework/UI, backend/API, settings/flags
      - Regression signals, responsive/usability, localization, security/data handling
      - Risks for cases phase, synthesis notes, **Approval digest**

      **ABSENT-intent guard:** When PR description and developer notes are missing or non-substantive, write
      `Functional intent: ABSENT — no independent intent source` in **Functional intent vs implementation**,
      do not reconstruct intent from the diff alone, and make obtaining intent the first halt question.

      **Co-produce delta specs in the same phase:** Create or update `specs/<capability>/spec.md` under this
      change for testable behavior introduced or changed, using the `specs` artifact instructions and
      `templates/spec.md` delta format. Copy the full requirement block from `qaspec/specs/<capability>/spec.md`
      before editing MODIFIED blocks. Encode agreed intent — never document a known defect as accepted SHALL/MUST behavior.

      After the user answers the halt (or requests edits), persist facts the user **explicitly addressed** in
      **Validated clarifications** only; keep unconfirmed inferences in **Unvalidated assumptions**. Adjust
      **Functional intent vs implementation** when intent differs from the diff, and update affected
      `specs/**/*.md` so requirements reflect the clarified intent. Do not leave approvals only in chat —
      `/qsx:cases` reads `analysis.md` and the delta specs as the approved source of truth.

      **Approval digest halt:** End with a compact digest (requirement headings one-liners + **Unvalidated assumptions**)
      and **zero to three** targeted questions. Do not fabricate a question when none exists — state that no blocking
      question exists and request digest approval. After user approval, run
      `qaspec approve analyze --change <name> [--head-sha <sha>]`.

      Do NOT write `testcases.md` in this step. Do not continue to cases in the same message.
    requires: []

  - id: test-cases
    generates: testcases.md
    description: Approved test cases with trackable checkboxes
    template: testcases.md
    instruction: |
      Create or update `testcases.md` as the QA task list (equivalent to `tasks.md` in spec-driven).

      **Language:** Write all artifact body text and halt messages in the project language from
      `qaspec/config.yaml` `context` and `rules.test-cases`.

      **Config:** Apply `rules.test-cases` — readable narrative, explicit BVA, API blocking when HTTP surface exists, settings on/off pairs when applicable.

      **Source of truth:** `analysis.md` and the change delta specs under `specs/**/*.md` are user-validated from
      `/qsx:analyze`. Read both in full before the PR diff. When they (especially **Validated clarifications**,
      **Functional intent vs implementation**, and **Synthesis notes**) conflict with current code or the diff,
      **the validated artifacts win** — encode tests for agreed intent, not accidental implementation. Known defects
      get cases that fail today and pass after fix.

      Before writing:
      - Run `qaspec status --change "<name>" --json` and check `approval.analyze`. When `stale` or `missing`, halt and ask the user to re-approve via `/qsx:analyze` — do not draft `testcases.md` in that message.
      - Load instructions for the `test-cases` artifact (`qaspec instructions` JSON).
      - Read `qaspec/references/qase_test_case_rules.md` (mandatory).
      - Read `analysis.md` in full (mandatory first read): **Validated clarifications**, **Affected capabilities**,
        **Functional intent vs implementation**, **Risks for cases phase**, **Synthesis notes**.
      - Read the change `specs/**/*.md` files in full (mandatory; binding input for the case list).
      - For each capability listed in `analysis.md`, read `qaspec/specs/<capability>/spec.md` when that file exists (context for regression cases).
      - Honor `workflow.multipleSubagents.cases` from `qaspec/config.yaml` (default false): when true, use dual blind analyst Task delegations for draft lists and pass the full `analysis.md` body and delta specs in each analyst brief as binding constraints; when false, orchestrator drafts cases with no Task subagents.
      - Use the PR diff only to derive how to observe/test agreed behavior — not to override validated analysis or specs.
      - Merge analyst drafts by intent; dedupe only when behavior and boundaries match.

      **Cover the approved specs:** Every requirement in the change delta specs MUST map to at least one
      case in `testcases.md`. Do not create or update `specs/**/*.md` in this step; when a
      user clarification during this conversation changes agreed behavior, update `analysis.md` and the affected
      delta specs first, then the case list.

      **Mandatory traceability:** Every case MUST carry `<!-- req: capability/requirement-slug -->`,
      `<!-- req: assumption:<id> -->`, or `<!-- req: gap -->` on the case line or immediately below.

      **IMPORTANT: Follow the checkbox template exactly.** Progress tracking parses `- [ ]` / `- [x]` only on checkbox lines; enriched case detail lives **below** each checkbox line.

      **Enriched case body (mandatory for new drafts):** Under each `- [ ] N.N Title` line, include:
      - **Preconditions:** standard environment and role prefix (per `qase_test_case_rules.md`) plus case-specific setup from sources
      - **Steps:** table or numbered list with **Action** and **Expected** per step; step 1 is navigation when a URL is known; empty Expected only for transition steps

      **Build from sources — do not invent:** Derive preconditions and steps from `analysis.md`, the change set (PR diff or patch), referenced requirements, `qaspec/specs/<capability>/spec.md`, and observable UI/API detail from code or docs read for this change. Do not use vague invented flows (e.g. "add an item via any available flow") unless sources lack actionable detail — then use one explicit generic step and document the gap (`<!-- gap: ... -->` or self-audit before halt).

      Guidelines:
      - Group under `## Suite: <name>` headings
      - One case = one checkbox: `- [ ] 1.1 Observable case title`, then Preconditions and Steps blocks
      - Mandatory traceability: `<!-- req: capability/requirement-slug -->` (or `assumption:<id>` / `gap`)
      - Use plain-language titles (tester-observable); no code identifiers in preconditions, steps, or expected results
      - Include explicit BVA, negative, regression, and resilience cases per `analysis.md`, the delta specs, and config rules

      **Validation gate:** Before the approval halt, run `qaspec validate cases --change <name>` (use `--json` when helpful).
      Fix all reported errors and re-run after edits. Include the validator coverage summary in the halt message.
      The halt is forbidden until validation passes.

      End with an approval question covering the case list (halt). Do not publish to Qase in this step.
    requires:
      - analyze
      - specs

  - id: specs
    generates: "specs/**/*.md"
    description: Change delta specifications aligned with the approved test cases
    template: spec.md
    instruction: |
      Create or update change delta specification files that define agreed testable behavior for this QA cycle.

      **Language:** Write requirement and scenario text in the project language from config.

      **Source of truth:** Same as analyze — `analysis.md` overrides PR/diff when they conflict.

      Before writing:
      - Read `analysis.md` in full (**Validated clarifications**, **Affected capabilities**, intent vs implementation).
      - For each affected capability, read `qaspec/specs/<capability>/spec.md` when present before writing MODIFIED blocks.

      Create one spec file per affected capability: `specs/<capability>/spec.md`.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New testable behavior for this change
      - **MODIFIED Requirements**: Changed behavior — MUST include full updated requirement block (copy from main spec first)
      - **REMOVED Requirements**: Deprecated behavior — MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only — use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format (exactly four `#` on Scenario headers)
      - Every requirement MUST have at least one scenario

      Co-produced with `analysis.md` in the analyze phase (`/qsx:analyze`). Chat iterations that change agreed
      behavior MUST update both `analysis.md` and these specs. In the cases phase, every requirement scenario here
      MUST be covered by at least one case in `testcases.md`.

      End with the same single halt as analyze when both are produced in one turn — do not start cases in the same message.
    requires:
      - analyze

apply:
  requires:
    - test-cases
    - specs
  tracks: testcases.md
  instruction: |
    Publish the approved test cases to Qase (MCP) and update tracking.

    **Language:** Write `publish-log.md` and user-facing halt text in the project language from config.

    Resolve TCMS target (no case upload in this phase):
    - Re-read `qaspec/references/qase_test_case_rules.md`
    - Confirm `testcases.md` is approved and checkbox-formatted
    - Confirm at least one file exists under `specs/` for this change (publish is blocked until delta specs exist)
    - Read completed `specs/**/*.md` for context when files exist
    - Resolve TCMS target for the change via `qaspec tcms show --change <name> --json` (change `.qaspec.yaml` `tcms` block; project config `tcms` supplies user-managed defaults only)
    - When the change has no usable target (provider + project):
      - **Default: propose creating a new TCMS project** for this change — suggest a code derived from the change/PR (e.g. PR415)
      - Discover existing projects via MCP listing tool only to present them as alternatives — never select one yourself
      - Present create-new (recommended) plus existing-project alternatives in **one** halt and **wait for the user's choice**; reuse an existing project only when the user explicitly selects it
      - If change contains legacy `execution-context.md`, surface its project code and base URL as one alternative
      - On create-new use MCP creation tool when available, otherwise instruct user to create in Qase UI and provide code
      - When MCP lacks list/create tools, ask for project code in the same single halt (still proposing create-new first)
      - After the user chooses, persist with `qaspec tcms set --change <name> --provider qase --project <CODE> [--base-url <url>]` and announce it
      - **Never write the `tcms` block in `qaspec/config.yaml`**
      - **Do not invoke Qase MCP for upload** in the same message as target selection or target persistence
    - Ignore legacy `publish-plan.md` if present

    **Publish gate:** Run `qaspec publish-gate --change <name>` before the publish summary. When it fails, report
    each listed precondition and how to resolve it — do not proceed to MCP. When it passes, note the gate token.

    Prepare summary and confirm (no Qase MCP upload in this phase):
    - Present in-chat publish summary derived from `testcases.md`: target (provider, project, base URL), each suite with unchecked-case count, warnings (cases without **Steps** blocks, suspected PII)
    - Include the **full payload of one representative case** (all mapped Qase fields) so the user validates the mapping, not just counts
    - End with **exactly one** confirmation halt citing the current gate token
    - **Do not invoke Qase MCP** in the same message as the summary

    After user confirms (with gate token cited):
    - Write `publish-log.md` rows for all planned cases as **pending** before the first MCP call
    - Re-read `testcases.md`
    - Read **Preconditions** and **Steps** under each unchecked case to publish; do not re-generate steps from titles alone when a **Steps** block exists
    - Read Qase MCP tool schemas before the first call
    - **Omit-on-unmapped:** Send only Qase fields documented in `qase_test_case_rules.md` mapping table; never infer severity/priority/type
    - Per case: mark publish-log row `in-flight` → MCP create → record returned ID + `done` → mark `- [x]` in `testcases.md`
    - On re-run: reconcile `pending`/`in-flight` rows against Qase by title or recorded ID before creating — never blind-create on retry

    User edits after the confirm halt: update `testcases.md` or note agreed exclusions, re-run publish gate, re-present summary, ask again for confirm before MCP.

    Do not write `execution-context.md`, `publish-plan.md`, or the `tcms` block in `qaspec/config.yaml`. Do not modify application source code under test. Stop on PII/secrets.
