name: qaspec-pr-review
version: 1
description: QASpec QA workflow — analysis → test cases + specs → Qase publish
artifacts:
  - id: analyze
    generates: analysis.md
    description: PR/requirements analysis, risks, and regression signals
    template: analysis.md
    instruction: |
      Create `analysis.md` as the testable-change analysis artifact.

      **Language:** Write all artifact body text and halt messages in the project language from
      `qaspec/config.yaml` `context` and `rules.analyze` (see docs/multi-language.md).

      **Config:** Apply global `context` (QA role, stack, domain) and `rules.analyze` from config — do not copy them into the file.

      Before writing:
      - Run `/qsx:analyze` skill steps: `qaspec instructions analyze --json` for template and resolvedOutputPath.
      - Read `qaspec/references/historical_bugs.md` from the project root (mandatory; re-read every pass).
      - Gather the change set via `gh pr diff` / `gh pr view` when reviewing a GitHub PR, or `git diff` / user-supplied patch otherwise.
      - Honor `workflow.multipleSubagents.review` from `qaspec/config.yaml` (default false): when true, use dual blind analyst Task delegations in parallel (each analyst fetches the diff) and synthesize Agreed / Single-analyst / Contradiction in **Synthesis notes**; when false, orchestrator fetches the diff and writes `analysis.md` with no Task subagents.

      Fill every section in the template, using N/A when not applicable:
      - Summary, **Affected capabilities** (kebab-case; no delta spec files in this step)
      - Functional intent vs implementation, **Validated clarifications** (N/A until user responds to halt)
      - Functional impact, framework/UI, backend/API, settings/flags
      - Regression signals, responsive/usability, localization, security/data handling
      - Risks for cases phase, synthesis notes, exactly **one** open question (halt)

      After the user answers the halt (or requests edits), persist every clarification in **Validated clarifications**
      and adjust **Functional intent vs implementation** when intent differs from the diff. Do not leave
      approvals only in chat — `/qsx:cases` reads `analysis.md` as the sole approved source of truth.

      Do NOT write `testcases.md` or `specs/**/*.md` in this step. End with one halt question; do not continue to cases in the same message.
    requires: []

  - id: test-cases
    generates: testcases.md
    description: Approved test cases with trackable checkboxes
    template: testcases.md
    instruction: |
      Create or update `testcases.md` as the QA task list (equivalent to `tasks.md` in spec-driven).

      **Language:** Write all artifact body text and halt messages in the project language from
      `qaspec/config.yaml` `context` and `rules.test-cases` / `rules.specs`.

      **Config:** Apply `rules.test-cases` and `rules.specs` — readable narrative, explicit BVA, API blocking when HTTP surface exists, settings on/off pairs when applicable.

      **Source of truth:** `analysis.md` is user-validated from `/qsx:analyze`. Read it in full before the PR diff.
      When `analysis.md` (especially **Validated clarifications**, **Functional intent vs implementation**, and
      **Synthesis notes**) conflicts with current code or the diff, **analysis.md wins** — encode tests and specs
      for agreed intent, not accidental implementation. Known defects get cases that fail today and pass after fix;
      never document a defect as accepted SHALL/MUST behavior.

      Before writing:
      - Load instructions for both `test-cases` and `specs` artifacts (`qaspec instructions` JSON).
      - Read `qaspec/references/qase_test_case_rules.md` (mandatory).
      - Read `analysis.md` in full (mandatory first read): **Validated clarifications**, **Affected capabilities**,
        **Functional intent vs implementation**, **Risks for cases phase**, **Synthesis notes**.
      - For each capability listed in `analysis.md`, read `qaspec/specs/<capability>/spec.md` when that file exists (baseline for MODIFIED deltas).
      - Honor `workflow.multipleSubagents.cases` from `qaspec/config.yaml` (default false): when true, use dual blind analyst Task delegations for draft lists and pass the full `analysis.md` body in each analyst brief as binding constraints; when false, orchestrator drafts cases and specs with no Task subagents.
      - Use the PR diff only to derive how to observe/test agreed behavior — not to override validated analysis.
      - Merge analyst drafts by intent; dedupe only when behavior and boundaries match.

      **Co-produce delta specs in the same phase:** Create or update `specs/<capability>/spec.md` under this change for testable behavior introduced or changed. Align requirements and scenarios with cases in `testcases.md` (no orphan requirements). Use the `specs` artifact instructions and `templates/spec.md` delta format.

      **IMPORTANT: Follow the checkbox template exactly.** Progress tracking parses `- [ ]` / `- [x]` only on checkbox lines; enriched case detail lives **below** each checkbox line.

      **Enriched case body (mandatory for new drafts):** Under each `- [ ] N.N Title` line, include:
      - **Preconditions:** standard environment and role prefix (per `qase_test_case_rules.md`) plus case-specific setup from sources
      - **Steps:** table or numbered list with **Action** and **Expected** per step; step 1 is navigation when a URL is known; empty Expected only for transition steps

      **Build from sources — do not invent:** Derive preconditions and steps from `analysis.md`, the change set (PR diff or patch), referenced requirements, `qaspec/specs/<capability>/spec.md`, and observable UI/API detail from code or docs read for this change. Do not use vague invented flows (e.g. "add an item via any available flow") unless sources lack actionable detail — then use one explicit generic step and document the gap (`<!-- gap: ... -->` or self-audit before halt).

      Guidelines:
      - Group under `## Suite: <name>` headings
      - One case = one checkbox: `- [ ] 1.1 Observable case title`, then Preconditions and Steps blocks
      - Optional traceability: `<!-- req: capability/requirement-slug -->` on a case line
      - Use plain-language titles (tester-observable); no code identifiers in preconditions, steps, or expected results
      - Include explicit BVA, negative, regression, and resilience cases per `analysis.md` and config rules
      - Self-audit before halt: every step traceable to a source unless marked as a documented gap

      End with exactly **one** approval question covering **both** the case list and the delta specs (halt). Do not publish to Qase in this step.
    requires:
      - analyze

  - id: specs
    generates: "specs/**/*.md"
    description: Change delta specifications aligned with the approved test cases
    template: spec.md
    instruction: |
      Create or update change delta specification files that define agreed testable behavior for this QA cycle.

      **Language:** Write requirement and scenario text in the project language from config.

      **Source of truth:** Same as test-cases — `analysis.md` overrides PR/diff when they conflict.

      Before writing:
      - Read `analysis.md` in full (**Validated clarifications**, **Affected capabilities**, intent vs implementation).
      - Read `testcases.md` when it exists; keep requirements aligned with listed cases.
      - For each affected capability, read `qaspec/specs/<capability>/spec.md` when present before writing MODIFIED blocks.

      Create one spec file per affected capability: `specs/<capability>/spec.md`.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New testable behavior for this change
      - **MODIFIED Requirements**: Changed behavior — MUST include full updated requirement block (copy from main spec first)
      - **REMOVED Requirements**: Deprecated behavior — MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only — use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format (exactly four `#` on Scenario headers)
      - Every requirement MUST have at least one scenario

      Co-produced with `testcases.md` in the cases phase (`/qsx:cases`). Chat iterations that change cases or requirements MUST update both artifacts.

      End with the same single halt as test-cases when both are produced in one turn — do not start publish in the same message.
    requires:
      - analyze

apply:
  requires:
    - test-cases
    - specs
  tracks: testcases.md
  instruction: |
    Publish the approved test cases to Qase (MCP) and update tracking.

    **Language:** Write `publish-log.md` and user-facing halt text in the project language from config.

    Resolve TCMS target (no case upload in this phase):
    - Re-read `qaspec/references/qase_test_case_rules.md`
    - Confirm `testcases.md` is approved and checkbox-formatted
    - Confirm at least one file exists under `specs/` for this change (publish is blocked until delta specs exist)
    - Read completed `specs/**/*.md` for context when files exist
    - Resolve TCMS target (provider, project code, base URL) from `tcms` block in `qaspec/config.yaml`
    - When config has no usable `tcms` block:
      - If change contains legacy `execution-context.md`, read project code and base URL from it and offer persisting them to `qaspec/config.yaml` `tcms` block
      - Otherwise discover Qase projects via MCP when a listing tool exists; present existing projects plus "create new" in **one** halt; on create-new use MCP creation tool when available, otherwise instruct user to create in Qase UI and provide code
      - When MCP lacks list/create tools, ask for project code in the same single halt
      - Persist chosen target to `qaspec/config.yaml` `tcms` block and announce the edit
      - **Do not invoke Qase MCP for upload** in the same message as target selection or `tcms` persistence
    - Ignore legacy `publish-plan.md` if present

    Prepare summary and confirm (no Qase MCP upload in this phase):
    - Present in-chat publish summary derived from `testcases.md`: target (provider, project, base URL), each suite with unchecked-case count, warnings (cases without **Steps** blocks, suspected PII)
    - End with **exactly one** confirmation halt
    - **Do not invoke Qase MCP** in the same message as the summary

    After user confirms:
    - Re-read `testcases.md`
    - Read **Preconditions** and **Steps** under each unchecked case to publish; do not re-generate steps from titles alone when a **Steps** block exists
    - Read Qase MCP tool schemas before the first call
    - Validate cases against rules; upload via MCP; write `publish-log.md` with suite/case trace (use template `templates/publish-log.md`)
    - Mark each published case `- [x]` in `testcases.md`

    User edits after the confirm halt: update `testcases.md` or note agreed exclusions, re-present summary, ask again for confirm before MCP.

    Do not write `execution-context.md` or `publish-plan.md`. Do not modify application source code under test. Stop on PII/secrets.
