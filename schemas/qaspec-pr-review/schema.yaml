name: qaspec-pr-review
version: 1
description: QASpec QA workflow — analysis → test matrix + specs → Qase publish
artifacts:
  - id: analyze
    generates: analisis.md
    description: PR/requirements analysis, risks, and regression signals
    template: analisis.md
    instruction: |
      Create `analisis.md` as the testable-change analysis artifact.

      **Language:** Write all artifact body text and halt messages in the project language from
      `qaspec/config.yaml` `context` and `rules.analyze` (see docs/multi-language.md).

      **Config:** Apply global `context` (QA role, stack, domain) and `rules.analyze` from config — do not copy them into the file.

      Before writing:
      - Run `/qas:analyze` skill steps: `qaspec instructions analyze --json` for template and resolvedOutputPath.
      - Read `qaspec/references/historical_bugs.md` from the project root (mandatory; re-read every pass).
      - Gather the change set via `gh pr diff` / `gh pr view` when reviewing a GitHub PR, or `git diff` / user-supplied patch otherwise.
      - Use dual blind analyst Task delegations in parallel (each analyst fetches the diff); synthesize Agreed / Single-analyst / Contradiction in **Synthesis notes**.

      Fill every section in the template, using N/A when not applicable:
      - Summary, **Affected capabilities** (kebab-case; no delta spec files in this step)
      - Functional intent vs implementation, **Validated clarifications** (N/A until user responds to halt)
      - Functional impact, framework/UI, backend/API, settings/flags
      - Regression signals, responsive/usability, localization, security/data handling
      - Risks for matrix phase, synthesis notes, exactly **one** open question (halt)

      After the user answers the halt (or requests edits), persist every clarification in **Validated clarifications**
      and adjust **Functional intent vs implementation** when intent differs from the diff. Do not leave
      approvals only in chat — `/qsx:matrix` reads `analisis.md` as the sole approved source of truth.

      Do NOT write `testmatrix.md` or `specs/**/*.md` in this step. End with one halt question; do not continue to matrix in the same message.
    requires: []

  - id: test-matrix
    generates: testmatrix.md
    description: Approved test case matrix with trackable checkboxes
    template: testmatrix.md
    instruction: |
      Create or update `testmatrix.md` as the QA task list (equivalent to `tasks.md` in spec-driven).

      **Language:** Write all artifact body text and halt messages in the project language from
      `qaspec/config.yaml` `context` and `rules.test-matrix` / `rules.specs`.

      **Config:** Apply `rules.test-matrix` and `rules.specs` — readable narrative, explicit BVA, API blocking when HTTP surface exists, settings on/off pairs when applicable.

      **Source of truth:** `analisis.md` is user-validated from `/qsx:analyze`. Read it in full before the PR diff.
      When `analisis.md` (especially **Validated clarifications**, **Functional intent vs implementation**, and
      **Synthesis notes**) conflicts with current code or the diff, **analisis.md wins** — encode tests and specs
      for agreed intent, not accidental implementation. Known defects get cases that fail today and pass after fix;
      never document a defect as accepted SHALL/MUST behavior.

      Before writing:
      - Load instructions for both `test-matrix` and `specs` artifacts (`qaspec instructions` JSON).
      - Read `qaspec/references/qase_test_case_rules.md` (mandatory).
      - Read `analisis.md` in full (mandatory first read): **Validated clarifications**, **Affected capabilities**,
        **Functional intent vs implementation**, **Risks for matrix phase**, **Synthesis notes**.
      - For each capability listed in `analisis.md`, read `qaspec/specs/<capability>/spec.md` when that file exists (baseline for MODIFIED deltas).
      - Use dual blind analyst Task delegations for draft lists; pass the full `analisis.md` body in each analyst brief as binding constraints.
      - Use the PR diff only to derive how to observe/test agreed behavior — not to override validated analysis.
      - Merge analyst drafts by intent; dedupe only when behavior and boundaries match.

      **Co-produce delta specs in the same phase:** Create or update `specs/<capability>/spec.md` under this change for testable behavior introduced or changed. Align requirements and scenarios with cases in `testmatrix.md` (no orphan requirements). Use the `specs` artifact instructions and `templates/spec.md` delta format.

      **IMPORTANT: Follow the checkbox template exactly.** Progress tracking parses `- [ ]` / `- [x]` only on checkbox lines; enriched case detail lives **below** each checkbox line.

      **Enriched case body (mandatory for new drafts):** Under each `- [ ] N.N Title` line, include:
      - **Preconditions:** standard environment and role prefix (per `qase_test_case_rules.md`) plus case-specific setup from sources
      - **Steps:** table or numbered list with **Action** and **Expected** per step; step 1 is navigation when a URL is known; empty Expected only for transition steps

      **Build from sources — do not invent:** Derive preconditions and steps from `analisis.md`, the change set (PR diff or patch), referenced requirements, `qaspec/specs/<capability>/spec.md`, and observable UI/API detail from code or docs read for this change. Do not use vague invented flows (e.g. "add an item via any available flow") unless sources lack actionable detail — then use one explicit generic step and document the gap (`<!-- gap: ... -->` or self-audit before halt).

      Guidelines:
      - Group under `## Suite: <name>` headings
      - One case = one checkbox: `- [ ] 1.1 Observable case title`, then Preconditions and Steps blocks
      - Optional traceability: `<!-- req: capability/requirement-slug -->` on a case line
      - Use plain-language titles (tester-observable); no code identifiers in preconditions, steps, or expected results
      - Include explicit BVA, negative, regression, and resilience cases per `analisis.md` and config rules
      - Self-audit before halt: every step traceable to a source unless marked as a documented gap

      End with exactly **one** approval question covering **both** the case list and the delta specs (halt). Do not publish to Qase in this step.
    requires:
      - analyze

  - id: specs
    generates: "specs/**/*.md"
    description: Change delta specifications aligned with the approved test matrix
    template: spec.md
    instruction: |
      Create or update change delta specification files that define agreed testable behavior for this QA cycle.

      **Language:** Write requirement and scenario text in the project language from config.

      **Source of truth:** Same as test-matrix — `analisis.md` overrides PR/diff when they conflict.

      Before writing:
      - Read `analisis.md` in full (**Validated clarifications**, **Affected capabilities**, intent vs implementation).
      - Read `testmatrix.md` when it exists; keep requirements aligned with listed cases.
      - For each affected capability, read `qaspec/specs/<capability>/spec.md` when present before writing MODIFIED blocks.

      Create one spec file per affected capability: `specs/<capability>/spec.md`.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New testable behavior for this change
      - **MODIFIED Requirements**: Changed behavior — MUST include full updated requirement block (copy from main spec first)
      - **REMOVED Requirements**: Deprecated behavior — MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only — use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format (exactly four `#` on Scenario headers)
      - Every requirement MUST have at least one scenario

      Co-produced with `testmatrix.md` in the matrix phase (`/qas:matrix`). Chat iterations that change cases or requirements MUST update both artifacts.

      End with the same single halt as test-matrix when both are produced in one turn — do not start publish in the same message.
    requires:
      - analyze

apply:
  requires:
    - test-matrix
    - specs
  tracks: testmatrix.md
  instruction: |
    Publish the approved matrix to Qase (MCP) and update tracking.

    **Language:** Write `publish-log.md`, `execution-context.md`, `publish-plan.md`, and user-facing halt text in the project language from config.

    Prepare (no Qase MCP in this phase):
    - Re-read `qaspec/references/qase_test_case_rules.md`
    - Confirm `testmatrix.md` is approved and checkbox-formatted
    - Confirm at least one file exists under `specs/` for this change (publish is blocked until delta specs exist)
    - Read completed `specs/**/*.md` for context when files exist
    - Resolve Qase prerequisites (project code, role, base URL) from existing artifacts, `execution-context.md`, or **one** halt question if missing — then persist to `execution-context.md`
    - Write or update `publish-plan.md` from unchecked cases in `testmatrix.md`, including each case's **Preconditions** and **Steps** when present (use template `templates/publish-plan.md`)
    - End with **exactly one** confirmation halt: user may edit `execution-context.md` and `publish-plan.md` or confirm publish
    - **Do not invoke Qase MCP** in the same message as initial creation of `execution-context.md` and `publish-plan.md`
    - If an approved case has no **Steps** block, warn the user to complete matrix before MCP (legacy title-only rows are not sufficient for Qase upload)

    After user confirms:
    - Re-read `execution-context.md`, `publish-plan.md`, and `testmatrix.md`
    - Read **Preconditions** and **Steps** under each case to publish; do not re-generate steps from titles alone when a **Steps** block exists
    - Read Qase MCP tool schemas before the first call
    - Validate matrix against rules; upload via MCP; write `publish-log.md` with suite/case trace
    - Mark each published case `- [x]` in `testmatrix.md`

    User edits after the confirm halt: update the prepare files in chat, then ask again for confirm before MCP.

    Do not modify application source code under test. Stop on PII/secrets.
